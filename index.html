<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GitHub Project Sync</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
  .animate-pulse { animation: pulse 1.5s ease-in-out infinite; }
</style>
</head>
<body class="bg-white text-black">

<!-- ============================================================
     CONFIG — set these two values and you're done.
     ============================================================ -->
<script>
  const GITHUB_USERNAME = "your-username-here";
  const GITHUB_TOKEN = "your-fine-grained-token-here"; // Public repositories, read-only
  const DAYS_UNTIL_LIVE = 7; // change this to adjust the "under development" window
</script>

<section class="py-16 px-4 max-w-6xl mx-auto">
  <div class="flex flex-col md:flex-row justify-between items-center gap-6 mb-12">
    <div class="text-center md:text-left">
      <p class="text-[#F9B233] font-semibold">— Projects</p>
      <h2 class="text-3xl md:text-4xl font-bold">
        <span class="text-[#F9B233] italic">Latest</span> Projects
      </h2>
    </div>
    <a id="github-link" href="#" target="_blank" rel="noreferrer"
       class="bg-black text-white px-6 py-3 rounded-full flex items-center gap-2 hover:bg-[#F9B233] hover:text-black transition">
      View GitHub
    </a>
  </div>

  <div id="grid" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
</section>

<!-- Modal -->
<div id="modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
  <div id="modal-content" class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden"></div>
</div>

<script type="module">
  import { fetchGitHubProjects } from "./projects.js";

  const grid = document.getElementById("grid");
  const modal = document.getElementById("modal");
  const modalContent = document.getElementById("modal-content");
  document.getElementById("github-link").href =
    `https://github.com/${GITHUB_USERNAME}?tab=repositories`;

  const isInProgress = (pushedAt) => {
    const daysSince = (Date.now() - new Date(pushedAt)) / (1000 * 60 * 60 * 24);
    return daysSince <= DAYS_UNTIL_LIVE;
  };

  const statusBadge = (status) => {
    const inProgress = isInProgress(status);
    return `<span class="text-xs px-2 py-1 rounded-full font-medium ${
      inProgress ? "bg-yellow-100 text-yellow-600" : "bg-green-100 text-green-600"
    }">${inProgress ? "In Progress" : "Live"}</span>`;
  };

  const skeletonCard = () => `
    <div class="bg-gray-50 rounded-2xl shadow-sm overflow-hidden animate-pulse">
      <div class="h-64 bg-gray-300"></div>
      <div class="p-6 text-left">
        <div class="w-1/3 h-6 bg-gray-300 mb-4"></div>
        <div class="w-full h-4 bg-gray-300 mb-4"></div>
      </div>
    </div>`;

  const projectCard = (proj) => `
    <div class="bg-gray-50 rounded-2xl shadow-sm hover:shadow-md transition-all duration-300 overflow-hidden cursor-pointer group" data-id="${proj.id}">
      <div class="relative">
        <img src="${proj.thumbnail}" alt="${proj.name}" class="w-full h-64 object-cover group-hover:scale-105 transition-transform duration-300" />
      </div>
      <div class="p-6 text-left">
        <div class="flex items-center gap-3 mb-1">
          <h3 class="text-lg font-semibold">${proj.name}</h3>
          ${statusBadge(proj.status)}
        </div>
        <p class="text-gray-600 text-sm line-clamp-2">${proj.description}</p>
      </div>
    </div>`;

  const openModal = (proj) => {
    modalContent.innerHTML = `
      <div class="relative">
        <img src="${proj.thumbnail}" alt="${proj.name}" class="w-full h-52 object-cover" />
        <button id="close-modal" class="absolute top-3 right-3 bg-black/60 text-white p-1.5 rounded-full hover:bg-black transition">✕</button>
      </div>
      <div class="p-6 text-left space-y-4">
        <div class="flex items-center gap-3">
          <h3 class="text-xl font-bold">${proj.name}</h3>
          ${statusBadge(proj.status)}
        </div>
        <p class="text-gray-600 text-sm leading-relaxed">${proj.description}</p>
        ${
          proj.languages.length
            ? `<div class="flex flex-wrap gap-2">${proj.languages
                .map((l) => `<span class="text-xs bg-gray-100 text-gray-700 px-3 py-1 rounded-full">${l}</span>`)
                .join("")}</div>`
            : ""
        }
        <div class="flex justify-between items-center pt-2">
          <a href="${proj.repoUrl}" target="_blank" rel="noopener noreferrer" class="text-yellow-600 font-medium hover:underline text-sm">View Repo</a>
          ${
            proj.liveUrl
              ? `<a href="${proj.liveUrl}" target="_blank" rel="noopener noreferrer" class="text-yellow-600 font-medium hover:underline text-sm">View Project</a>`
              : ""
          }
        </div>
      </div>`;
    modal.classList.remove("hidden");
    modal.classList.add("flex");
    document.getElementById("close-modal").onclick = closeModal;
  };

  const closeModal = () => {
    modal.classList.add("hidden");
    modal.classList.remove("flex");
  };
  modal.addEventListener("click", (e) => {
    if (e.target === modal) closeModal();
  });

  // Show skeletons immediately
  grid.innerHTML = skeletonCard() + skeletonCard();

  fetchGitHubProjects(GITHUB_USERNAME, GITHUB_TOKEN).then((projects) => {
    if (!projects.length) {
      grid.innerHTML = `<p class="text-gray-500 col-span-2 text-center">No starred repos found.</p>`;
      return;
    }
    grid.innerHTML = projects.map(projectCard).join("");
    grid.querySelectorAll("[data-id]").forEach((card) => {
      const proj = projects.find((p) => String(p.id) === card.dataset.id);
      card.addEventListener("click", () => openModal(proj));
    });
  });
</script>
</body>
</html>
